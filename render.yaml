services:
  - type: web
    name: paper-trails
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev && npm run check
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.22.1
      - key: HOST
        value: 0.0.0.0
      - key: PAPER_TRAILS_DEMO
        value: "false"
      - key: COOKIE_SECURE
        value: "true"
      - key: PAPER_TRAILS_REQUIRE_TURSO
        value: "true"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
